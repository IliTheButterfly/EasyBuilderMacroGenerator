[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "eb_macro_gen"
version = "1.1.1"
authors = [
  { name="IliTheButterfly", email="iliana.decarufel@gmail.com" },
]
description = "An API to allow generating EasyBuilder Pro macros"
readme = "ReadMe.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE*"]
dependencies = [
  "pyperclip",
  "db-sqlite3",
  "typing_extensions>=4.0; python_version < '3.12'",
]
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
koyo-tags-import = "eb_macro_gen.tools.koyo_tags_import:main"
combine-tags = "eb_macro_gen.tools.combine_tags:main"


[tool.hatch.build.targets.sdist]
include = [
  "src/*",
  "test"
]

[project.urls]
Homepage = "https://github.com/IliTheButterfly/EasyBuilderMacroGnerator"
Issues = "https://github.com/IliTheButterfly/EasyBuilderMacroGnerator/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["examples", "temp", "dist"]

[tool.ruff.lint]
# Bug-catching ruleset, not style. Wildcard-import rules (F403/F405) are
# disabled until the public API is migrated off `from .X import *`.
select = [
  "F401",  # unused-import
  "F601",  # multi-value-repeated-key-literal
  "F811",  # redefined-while-unused
  "F841",  # unused-variable
  "E711",  # comparison-to-none
  "E712",  # comparison-to-bool
  "E713",  # not-in
  "E714",  # not-is
  "E722",  # bare-except
  "W605",  # invalid-escape-sequence
]
